<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#faf8f5" />
    <title>You’re offline</title>
    <style>
      :root {
        color-scheme: light;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        min-height: 100dvh;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
          "Helvetica Neue", sans-serif;
        background: #faf8f5;
        color: #3d3530;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        user-select: none;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(2rem, env(safe-area-inset-top)) 1.5rem
          max(2rem, env(safe-area-inset-bottom));
        text-align: center;
      }
      main {
        max-width: 20rem;
      }
      .mark {
        width: 3.5rem;
        height: 3.5rem;
        margin: 0 auto 1.25rem;
        border-radius: 1rem;
        background: #eef2ee;
        color: #8fa68f;
        display: grid;
        place-items: center;
        font-size: 1.5rem;
        font-weight: 600;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.35rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 1.5rem;
        font-size: 0.95rem;
        line-height: 1.45;
        color: #9a8f85;
      }
      button {
        appearance: none;
        border: 0;
        border-radius: 0.9rem;
        background: #8fa68f;
        color: #fff;
        font: inherit;
        font-size: 1rem;
        font-weight: 600;
        min-height: 2.85rem;
        padding: 0.75rem 1.25rem;
        width: 100%;
      }
      button:active {
        opacity: 0.88;
      }
      .hint {
        margin-top: 1rem;
        font-size: 0.8rem;
        color: #9a8f85;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">···</div>
      <h1>You’re offline</h1>
      <p>Check your connection, then try again. Your village will be here when you’re back online.</p>
      <button type="button" id="retry">Try again</button>
      <p class="hint">Wi‑Fi or cellular needed to sync care logs.</p>
    </main>
    <script>
      document.getElementById("retry").addEventListener("click", function () {
        // Prefer hard reload of the live app origin when configured.
        var live = "https://it-takes-a-village.vercel.app/";
        try {
          window.location.replace(live);
        } catch (e) {
          window.location.reload();
        }
      });
    </script>
  </body>
</html>
